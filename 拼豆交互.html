    <div class="ed-size-mask" id="edSizeMask">
      <div class="ed-size-dialog">
        <div class="ed-size-title">📐 修改画板尺寸</div>
        <div class="ed-size-row">
          <label>宽（格）</label>
          <input type="number" id="edSizeW" min="1" max="200" step="1" value="${cols}">
        </div>
        <div class="ed-size-row">
          <label>高（格）</label>
          <input type="number" id="edSizeH" min="1" max="200" step="1" value="${rows}">
        </div>
        <div class="ed-size-presets" id="edSizePresets">
          <button data-sw="16" data-sh="16">16×16</button>
          <button data-sw="24" data-sh="24">24×24</button>
          <button data-sw="32" data-sh="32">32×32</button>
          <button data-sw="48" data-sh="48">48×48</button>
          <button data-sw="64" data-sh="64">64×64</button>
          <button data-sw="100" data-sh="100">100×100</button>
        </div>
        <div class="ed-size-hint">范围 1 ~ 200 格 · 修改后原有图案会居中保留</div>
        <div class="ed-size-btns">
          <button class="ghost-btn" id="edSizeCancel">取消</button>
          <button class="primary-btn" id="edSizeConfirm">应用</button>
        </div>
      </div>
    </div>
  `;
  editorOverlay.classList.add('show');

  const stage = document.getElementById('editorStage');
  const canvasWrap = document.getElementById('canvasWrap');
  const canvas = document.getElementById('edCanvas');
  const ctx = canvas.getContext('2d');
  const colorPanel = document.getElementById('colorPanel');
  const cpTabs = document.getElementById('cpTabs');
  const cpGrid = document.getElementById('cpGrid');
  const paletteBtn = document.getElementById('edPaletteBtn');
  const edSizeMask = document.getElementById('edSizeMask');

  let displayW = 300, displayH = 300, maxPan = 210;
  let panX = 0, panY = 0;

  function fitCanvas(){
    const vp = document.getElementById('canvasViewport');
    if(!vp) return;
    const cs = getComputedStyle(vp);
    const availW = Math.max(80, vp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
    const availH = Math.max(80, vp.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
    let w = availW;
    let h = Math.round(w * rows / cols);
    if(h > availH){ h = availH; w = Math.round(h * cols / rows); }
    displayW = Math.max(60, w);
    displayH = Math.max(60, h);
    canvasWrap.style.width = displayW + 'px';
    canvasWrap.style.height = displayH + 'px';
    maxPan = Math.max(displayW, displayH) * 0.7;
  }
  fitCanvas();

  function syncCanvasSize(){
    canvas.width = cols;
    canvas.height = rows;
    canvasWrap.style.setProperty('--cols', cols);
    canvasWrap.style.setProperty('--rows', rows);
    canvasWrap.classList.toggle('no-grid', cols >= 80);
    panX = 0; panY = 0;
    canvasWrap.style.transform = 'translate(0px, 0px)';
  }

  function updateHeaderInfo(){
    const t = document.getElementById('edTitle');
    if(t) t.textContent = `编辑图纸 · ${cols*rows} 颗豆`;
    const chipText = document.getElementById('edSizeChipText');
    if(chipText) chipText.textContent = `${cols}×${rows}`;
  }

  function hexToRgb(hex){
    return {
      r: parseInt(hex.slice(1,3),16),
      g: parseInt(hex.slice(3,5),16),
      b: parseInt(hex.slice(5,7),16)
    };
  }

  function renderAll(){
    const imgData = ctx.createImageData(cols, rows);
    for(let i=0;i<cols*rows;i++){
      const {r,g,b} = hexToRgb(current[i] || '#ffffff');
      imgData.data[i*4] = r;
      imgData.data[i*4+1] = g;
      imgData.data[i*4+2] = b;
      imgData.data[i*4+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function paintOne(idx){
    const x = idx % cols;
    const y = Math.floor(idx / cols);
    ctx.fillStyle = current[idx];
    ctx.fillRect(x, y, 1, 1);
  }

  function refreshStats(){
    const stats = computeBeanStats(current);
    const box = document.getElementById('beanStatsContainer');
    if(box) box.innerHTML = renderBeanStatsHTML(stats);
  }

  function pushHistory(){
    if(histIndex < history.length - 1) history.splice(histIndex + 1);
    history.push({ cols, rows, colors: current.slice() });
    while(history.length > 30) history.shift();
    histIndex = history.length - 1;
  }

  function restoreSnapshot(snap){
    cols = snap.cols;
    rows = snap.rows;
    current = snap.colors.slice();
    syncCanvasSize();
    fitCanvas();
    renderAll();
    refreshStats();
    updateHeaderInfo();
  }

  function goPrev(){
    if(histIndex <= 0){ showToast('已经是第一步啦'); return; }
    histIndex--;
    restoreSnapshot(history[histIndex]);
    showToast('↩️ 上一步');
  }

  function goNext(){
    if(histIndex >= history.length - 1){ showToast('已经是最后一步啦'); return; }
    histIndex++;
    restoreSnapshot(history[histIndex]);
    showToast('↪️ 下一步');
  }

  function applyResize(newCols, newRows){
    newCols = Math.max(1, Math.min(200, Math.round(newCols)));
    newRows = Math.max(1, Math.min(200, Math.round(newRows)));
    if(!isFinite(newCols) || !isFinite(newRows)) return;
    if(newCols === cols && newRows === rows){ showToast('尺寸没有变化'); return; }

    const oldCols = cols, oldRows = rows;
    const next = new Array(newCols * newRows).fill('#ffffff');
    const offX = Math.round((newCols - oldCols) / 2);
    const offY = Math.round((newRows - oldRows) / 2);

    for(let y = 0; y < oldRows; y++){
      for(let x = 0; x < oldCols; x++){
        const nx = x + offX;
        const ny = y + offY;
        if(nx >= 0 && nx < newCols && ny >= 0 && ny < newRows){
          next[ny * newCols + nx] = current[y * oldCols + x];
        }
      }
    }

    cols = newCols;
    rows = newRows;
    current = next;

    syncCanvasSize();
    pushHistory();
    fitCanvas();
    renderAll();
    refreshStats();
    updateHeaderInfo();
    showToast(`✅ 画板已调整为 ${cols}×${rows}`, 1800);
  }

  const edSizeW = document.getElementById('edSizeW');
  const edSizeH = document.getElementById('edSizeH');
  const edSizePresets = document.getElementById('edSizePresets');

  function markPresetActive(){
    const w = parseInt(edSizeW.value), h = parseInt(edSizeH.value);
    edSizePresets.querySelectorAll('button').forEach(b=>{
      const bw = parseInt(b.dataset.sw), bh = parseInt(b.dataset.sh);
      b.classList.toggle('active', bw === w && bh === h);
    });
  }

  function openSizeDialog(){
    edSizeW.value = cols;
    edSizeH.value = rows;
    markPresetActive();
    edSizeMask.classList.add('show');
    setTimeout(()=>{ try{ edSizeW.focus(); edSizeW.select(); }catch(_){} }, 60);
  }
  function closeSizeDialog(){ edSizeMask.classList.remove('show'); }

  edSizePresets.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      edSizeW.value = btn.dataset.sw;
      edSizeH.value = btn.dataset.sh;
      markPresetActive();
    };
  });
  edSizeW.addEventListener('input', markPresetActive);
  edSizeH.addEventListener('input', markPresetActive);

  document.getElementById('edSizeCancel').onclick = closeSizeDialog;
  edSizeMask.addEventListener('click', e=>{
    if(e.target === edSizeMask) closeSizeDialog();
  });
  document.getElementById('edSizeConfirm').onclick = ()=>{
    const w = parseInt(edSizeW.value);
    const h = parseInt(edSizeH.value);
    if(!w || !h || w < 1 || h < 1 || w > 200 || h > 200){
      showToast('请输入 1 ~ 200 之间的尺寸');
      return;
    }
    closeSizeDialog();
    applyResize(w, h);
  };

  function doFloodFill(idx){
    if(idx < 0) return;
    const target = current[idx];
    const color = brush;
    if(target === color){ showToast('该区域已经是这个颜色了'); return; }

    const total = cols * rows;
    const visited = new Uint8Array(total);
    const stack = [idx];
    visited[idx] = 1;
    let count = 0;

    while(stack.length){
      const i = stack.pop();
      if(current[i] !== target) continue;
      current[i] = color;
      count++;
      const x = i % cols, y = (i / cols) | 0;
      if(x > 0 && !visited[i-1]){ visited[i-1] = 1; stack.push(i-1); }
      if(x < cols-1 && !visited[i+1]){ visited[i+1] = 1; stack.push(i+1); }
      if(y > 0 && !visited[i-cols]){ visited[i-cols] = 1; stack.push(i-cols); }
      if(y < rows-1 && !visited[i+cols]){ visited[i+cols] = 1; stack.push(i+cols); }
    }
    pushHistory();
    renderAll(); refreshStats();
    showToast(`🪣 已批量填充 ${count} 格`);
  }

  function doEraseSame(idx){
    if(idx < 0) return;
    const target = current[idx];
    if(target === '#ffffff'){ showToast('这一格已经是空白啦'); return; }
    let count = 0;
    for(let i=0;i<current.length;i++){
      if(current[i] === target){ current[i] = '#ffffff'; count++; }
    }
    if(!count) return;
    pushHistory();
    renderAll(); refreshStats();
    showToast(`💥 已批量擦除 ${count} 格同色`);
  }

  const hintMap = {
    move:'✋ 移动画板：按住拖动查看画布不同区域',
    brush:'🖌️ 画笔：点击 / 拖动格子修改颜色',
    eraser:'🧽 橡皮：点击 / 拖动格子擦除为白色',
    fill:'🪣 批量填充：点击格子 → 相连的同色区域全部变为画笔色',
    eraseSame:'💥 批量擦除同色：点击格子 → 画布上所有同色格一次性擦为白色'
  };
  function setMode(m){
    mode = m;
    const ids = { move:'edMove', brush:'edBrush', eraser:'edEraser', fill:'edFill', eraseSame:'edEraseSame' };
    Object.keys(ids).forEach(k=>{
      const el = document.getElementById(ids[k]);
      if(el) el.classList.toggle('active', k === m);
    });
    document.getElementById('edHint').textContent = hintMap[m];
    stage.classList.toggle('pan-mode', m === 'move');
  }

  renderAll();
  refreshStats();

  let activeSeries = '常用';

  function setBrush(c){
    brush = c;
    const input = document.getElementById('edCustomColor');
    if(input) input.value = c.toLowerCase();
    document.getElementById('edBrushVal').textContent = c.toUpperCase();
    if(mode === 'eraser' || mode === 'move') setMode('brush');
  }

  function renderPalette(){
    cpTabs.innerHTML = Object.keys(COLOR_SERIES).map(k=>
      `<button class="cp-tab ${k===activeSeries?'active':''}" data-s="${k}">${k}</button>`
    ).join('');
    const list = COLOR_SERIES[activeSeries] || [];
    cpGrid.innerHTML = list.map(c=>
      `<div class="cp-swatch ${c.toUpperCase()===brush.toUpperCase()?'active':''}" style="background:${c}" data-c="${c}"></div>`
    ).join('');
    cpTabs.querySelectorAll('.cp-tab').forEach(t=>{
      t.onclick = ()=>{ activeSeries = t.dataset.s; renderPalette(); };
    });
    cpGrid.querySelectorAll('.cp-swatch').forEach(sw=>{
      sw.onclick = ()=>{ setBrush(sw.dataset.c); renderPalette(); };
    });
  }
  renderPalette();

  function togglePalette(force){
    const show = force !== undefined ? force : !colorPanel.classList.contains('show');
    colorPanel.classList.toggle('show', show);
    paletteBtn.classList.toggle('active', show);
  }
  paletteBtn.onclick = (e)=>{ e.stopPropagation(); togglePalette(); };
  document.getElementById('cpClose').onclick = ()=> togglePalette(false);

  const colorInput = document.getElementById('edCustomColor');
  colorInput.addEventListener('input', e=>{
    setBrush(e.target.value.toUpperCase());
    renderPalette();
  });

  const applyPan = ()=>{ canvasWrap.style.transform = `translate(${panX}px, ${panY}px)`; };

  let dragMode = null;
  let panStart = null;
  let painting = false;
  let paintingDirty = false;
  let lastIdx = -1;

  const getIdx = (e)=>{
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / rect.width * cols);
    const y = Math.floor((e.clientY - rect.top) / rect.height * rows);
    if(x<0 || x>=cols || y<0 || y>=rows) return -1;
    return y * cols + x;
  };

  const paintAt = (e)=>{
    const idx = getIdx(e);
    if(idx < 0 || idx === lastIdx) return;
    lastIdx = idx;
    const color = mode === 'eraser' ? '#ffffff' : brush;
    if(current[idx] === color) return;
    current[idx] = color;
    paintingDirty = true;
    paintOne(idx);
  };

  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('.editor-float-tools')) return;
    if(e.target.closest('.color-panel')) return;
    if(e.target.closest('.editor-float-nav')) return;
    togglePalette(false);

    if(mode === 'move'){
      dragMode = 'pan';
      panStart = { x:e.clientX, y:e.clientY, px:panX, py:panY };
      stage.classList.add('panning');
      try{ stage.setPointerCapture(e.pointerId); }catch(_){}
      return;
    }

    const idx = getIdx(e);
    if(idx < 0) return;

    if(mode === 'fill'){ doFloodFill(idx); return; }
    if(mode === 'eraseSame'){ doEraseSame(idx); return; }

    painting = true;
    paintingDirty = false;
    dragMode = 'paint';
    lastIdx = -1;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    paintAt(e);
  });

  stage.addEventListener('pointermove', e=>{
    if(dragMode === 'pan'){
      panX = panStart.px + (e.clientX - panStart.x);
      panY = panStart.py + (e.clientY - panStart.y);
      panX = Math.max(-maxPan, Math.min(maxPan, panX));
      panY = Math.max(-maxPan, Math.min(maxPan, panY));
      applyPan();
      return;
    }
    if(painting) paintAt(e);
  });

  const endPointer = (e)=>{
    if(dragMode === 'pan'){
      dragMode = null;
      stage.classList.remove('panning');
      try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
      return;
    }
    if(painting){
      painting = false;
      if(paintingDirty){ pushHistory(); paintingDirty = false; refreshStats(); }
      lastIdx = -1;
      try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
    }
    dragMode = null;
  };
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', ()=>{
    painting = false; paintingDirty = false; dragMode = null; lastIdx = -1;
    stage.classList.remove('panning');
  });

  document.getElementById('edMove').onclick = ()=> setMode('move');
  document.getElementById('edBrush').onclick = ()=> setMode('brush');
  document.getElementById('edEraser').onclick = ()=> setMode('eraser');
  document.getElementById('edFill').onclick = ()=> setMode('fill');
  document.getElementById('edEraseSame').onclick = ()=> setMode('eraseSame');

  document.getElementById('edUndoFloat').onclick = goPrev;
  document.getElementById('edRedoFloat').onclick = goNext;

  document.getElementById('edResize').onclick = ()=> openSizeDialog();
  document.getElementById('edSizeChip').onclick = ()=> openSizeDialog();

  document.getElementById('edClear').onclick = ()=>{
    current = current.map(()=> '#ffffff');
    pushHistory();
    renderAll(); refreshStats();
    showToast('🗑️ 已清空画布');
  };

  function saveDraft(){
    if(finalized) return;
    const used = current.filter(c=>c !== '#ffffff').length;
    if(used < 3) return;
    if(activeDraftId){
      const d = drafts.find(x=>x.id === activeDraftId);
      if(d){ d.colors = current.slice(); d.cols = cols; d.rows = rows; d.time = '刚刚'; }
    } else {
      const nid = 'd' + (state.nextId++);
      drafts.unshift({
        id: nid,
        title: '未命名图纸',
        type: workType,
        cols, rows,
        colors: current.slice(),
        time: '刚刚'
      });
      activeDraftId = nid;
    }
    showToast('📝 已存入草稿箱', 1500);
  }

  const closeWithDraft = ()=>{
    saveDraft();
    editorOverlay.classList.remove('show');
  };

  document.getElementById('edClose').onclick = closeWithDraft;
  document.getElementById('edCancel').onclick = closeWithDraft;

  document.getElementById('edSave').onclick = ()=>{
    const used = current.filter(c=>c!=='#ffffff').length;
    if(used < 3){ showToast('✏️ 图纸太简单了，再画一点吧'); return; }
    finalized = true;
    if(activeDraftId) drafts = drafts.filter(x=>x.id !== activeDraftId);
    editorOverlay.classList.remove('show');
    setTimeout(()=>openSaveCenterDialog(current, cols, rows, workType), 300);
  };
}

function openPublishSheet(payload){

    </div>
    <button class="primary-btn" id="pubConfirm">发布</button>
    <button class="ghost-btn" id="pubCancel">取消</button>
  `;

  document.querySelectorAll('#pubCats .cat-opt').forEach(opt=>{
    opt.onclick = ()=>{
      document.querySelectorAll('#pubCats .cat-opt').forEach(o=>o.classList.remove('active'));
      opt.classList.add('active');
      category = opt.dataset.c;
    };
  });
  document.getElementById('pubCancel').onclick = ()=> maskEl.classList.remove('show');

  document.getElementById('pubConfirm').onclick = ()=>{
    const title = document.getElementById('pubTitle').value.trim();
    if(!title){ showToast('✏️ 请填写作品名称'); return; }

    const id = state.nextId++;
    const base = {
      id, title, category,
      author:'我', avatarColor:'#ff5c8a',
      likes:0, liked:false, collects:0, collected:false, followed:false,
      seed: Math.floor(Math.random()*9000)+1000,
      time:'刚刚', published:true,
      type: type || 'parse',
      comments:[]
    };

    if(kind === 'image'){
      base.image = image;
      base.size = 1; base.rows = 1;
      base.customColors = null;
    } else {
      base.size = cols; base.rows = rows;
      base.customColors = colors.slice();
    }

    artworks.unshift(base);

    maskEl.classList.remove('show');
    showToast('🎉 发布成功！已出现在社区');
    state.category = '推荐';
    switchPage('material');
  };
}

function openDetail(id){

    : `<button class="follow-btn ${a.followed?'following':''}" id="dFollow">${a.followed?'已关注':'+ 关注'}</button>`;

  detailOverlay.innerHTML = `
    <div class="ov-head">
      <div class="back-btn" id="dBack">‹</div>
      <div class="t">作品详情</div>
    </div>
    <div class="ov-scroll">
      <div class="detail-cover">
        ${coverHTML}
      </div>
      <div class="detail-title">${a.title}</div>
      <div class="detail-meta">${metaText}</div>
      <div class="author-row">
        <div class="author-avatar" style="background:${a.avatarColor}">${a.author[0]}</div>
        <div style="flex:1;">
          <div class="author-name">${a.author}</div>
          <div class="author-sub">拼豆创作者</div>
        </div>
        ${followHTML}
      </div>
      <div class="action-bar">
        <button class="act-btn ${a.liked?'liked':''}" id="dLike">❤️ ${a.likes}</button>
        <button class="act-btn ${a.collected?'collected':''}" id="dCollect">⭐ ${a.collects}</button>
        <button class="act-btn" id="dShare">↗ 分享</button>
      </div>
      <div class="comment-head">评论 ${a.comments.length}</div>
      <div id="commentList">
        ${a.comments.length ? a.comments.map(c=>`
          <div class="comment-item">
            <div class="cm-avatar" style="background:${c.color||'#ccc'}">${c.user[0]}</div>
            <div class="cm-body">
              <div class="cm-user">${c.user}</div>
              <div class="cm-text">${c.text}</div>
              <div class="cm-time">${c.time}</div>
            </div>
          </div>
        `).join('') : '<div class="empty-cm">还没有评论，来抢沙发～</div>'}
      </div>
    </div>
    <div class="cm-input-bar">
      <input class="cm-input" id="cmInput" placeholder="说点什么…" maxlength="60">
      <button class="cm-send" id="cmSend">发送</button>
    </div>
  `;
  detailOverlay.classList.add('show');
  document.getElementById('dBack').onclick = ()=> detailOverlay.classList.remove('show');

  const fBtn = document.getElementById('dFollow');
  if(fBtn){
    fBtn.onclick = ()=>{
      a.followed = !a.followed;
      fBtn.classList.toggle('following', a.followed);
      fBtn.textContent = a.followed?'已关注':'+ 关注';
      if(a.followed){
        if(!followingList.some(f=>f.name===a.author)){
          followingList.push({ name:a.author, color:a.avatarColor, sub:'拼豆创作者', followed:true });
        }
      } else {
        followingList = followingList.filter(f=>f.name!==a.author);
      }
      showToast(a.followed?`✅ 已关注 ${a.author}`:'已取消关注');
    };
  }
  const likeBtn = document.getElementById('dLike');
  likeBtn.onclick = ()=>{
    a.liked = !a.liked;
    a.likes += a.liked?1:-1;
    likeBtn.classList.toggle('liked', a.liked);
    likeBtn.innerHTML = `❤️ ${a.likes}`;
    showToast(a.liked?'❤️ 点赞成功':'已取消点赞');
  };
  const colBtn = document.getElementById('dCollect');
  colBtn.onclick = ()=>{
    a.collected = !a.collected;
    a.collects += a.collected?1:-1;
    colBtn.classList.toggle('collected', a.collected);
    colBtn.innerHTML = `⭐ ${a.collects}`;
    showToast(a.collected?'⭐ 已收藏':'已取消收藏');
  };
  document.getElementById('dShare').onclick = ()=> showToast('🔗 链接已复制，快去分享吧');

  const input = document.getElementById('cmInput');
  const send = ()=>{
    const txt = input.value.trim();
    if(!txt){ showToast('💬 请输入评论内容'); return; }
    a.comments.unshift({ user:'我', color:'#ff5c8a', text:txt, time:'刚刚' });
    input.value = '';
    const list = document.getElementById('commentList');
    list.innerHTML = a.comments.map(c=>`
      <div class="comment-item">
        <div class="cm-avatar" style="background:${c.color||'#ccc'}">${c.user[0]}</div>
        <div class="cm-body">
          <div class="cm-user">${c.user}</div>
          <div class="cm-text">${c.text}</div>
          <div class="cm-time">${c.time}</div>
        </div>
      </div>
    `).join('');
    document.querySelector('.comment-head').textContent = `评论 ${a.comments.length}`;
    showToast('💬 评论发布成功');
  };
  document.getElementById('cmSend').onclick = send;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

      btn.onclick = (e)=>{
        e.stopPropagation();
        const d = downloads.find(x=>x.id === btn.dataset.id);
        if(!d) return;
        if(btn.dataset.act === 'del'){
          downloads = downloads.filter(x=>x.id !== d.id);
          showToast('🗑️ 已删除下载记录');
          render();

      item.addEventListener('click', ()=>{

/* ============================================================
   页面切换
============================================================ */
function switchPage(page){
  state.page = page;
  if(page !== 'home') clearInterval(homeBannerTimer);
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.classList.toggle('active', item.dataset.page===page);
  });
  if(page==='home') renderHome();
  else if(page==='create') renderMyWorks();
  else if(page==='material') renderMaterial();
  else if(page==='profile') renderProfile();
  appContent.scrollTop = 0;
}

document.getElementById('bottomNav').addEventListener('click', e=>{
  const item = e.target.closest('.nav-item');
  if(!item) return;
  switchPage(item.dataset.page);
});

maskEl.addEventListener('click', e=>{
  if(e.target.id==='mask') e.target.classList.remove('show');
});

saveCenterMask.addEventListener('click', e=>{
  if(e.target.id==='saveCenterMask') saveCenterMask.classList.remove('show');
});

/* ============================================================
   初始化
============================================================ */
document.querySelectorAll('.nav-item').forEach(item=>{
  const ic = item.querySelector('.ico');
  const key = item.dataset.page;
  if(ic && NAV_ICONS[key]) ic.innerHTML = NAV_ICONS[key];
});

renderHome();
</script>
