<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>拼豆 · 交互原型 v8 · 图纸解析 · 色号匹配</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
  body { background:#e4e4ec; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }

  .phone {
    width:390px; height:800px; background:#fff; border-radius:44px;
    box-shadow:0 40px 70px -20px rgba(0,0,0,.35),0 0 0 10px #1c1c1e,0 0 0 12px #3a3a3c;
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .status-bar { display:flex; justify-content:space-between; align-items:center;
    padding:16px 28px 6px; font-size:13px; font-weight:600; color:#111; background:#fff; flex-shrink:0; z-index:10; }
  .app-content { flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 18px 20px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; position:relative; }
  .app-content::-webkit-scrollbar { display:none; }

  /* ===== 底部导航 ===== */
  .bottom-nav { display:flex; justify-content:space-around; align-items:center;
    padding:8px 8px 24px; background:rgba(255,255,255,.94);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid #f2f2f6; flex-shrink:0; z-index:10;
    box-shadow:0 -8px 24px rgba(20,20,50,.05); }
  .nav-item { display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10px; color:#9a9aa3; cursor:pointer; padding:4px 10px; border-radius:20px;
    transition:all .18s; user-select:none; }
  .nav-item .ico { width:23px; height:23px; display:flex; align-items:center; justify-content:center;
    line-height:1; transition:transform .18s; }
  .nav-item.active { color:#ff5c8a; font-weight:700; }
  .nav-item.active .ico { transform:translateY(-2px) scale(1.08); }

  .page-head { display:flex; justify-content:space-between; align-items:center; padding:10px 0 6px; }
  .page-title { font-size:25px; font-weight:800; letter-spacing:-.6px; color:#16161a; }
  .page-title em { font-style:normal; color:#ff5c8a; }

  .section-title { font-size:15px; font-weight:700; color:#16161a; position:relative;
    display:flex; justify-content:space-between; align-items:center; margin:18px 0 10px;
    padding-left:10px; letter-spacing:-.2px; }
  .section-title::before {
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:13px; border-radius:2px;
    background:linear-gradient(180deg,#ff9dbb,#ff5c8a);
  }
  .section-title a { font-size:12px; color:#ff5c8a; font-weight:600; text-decoration:none; }

  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .card { background:#fff; border-radius:20px; padding:15px 14px;
    border:1px solid #f0f0f5; box-shadow:0 4px 14px rgba(20,20,50,.035);
    display:flex; flex-direction:column; gap:7px; cursor:pointer; transition:all .14s; }
  .card:active { transform:scale(.965); background:#fff8fa; }
  .card .c-ico { font-size:27px; line-height:1; }
  .card .c-title { font-weight:700; font-size:14px; color:#16161a; }
  .card .c-desc { font-size:10.5px; color:#9a9aa3; line-height:1.35; }

  .card.compact {
    flex-direction:row; align-items:center; justify-content:space-between;
    gap:8px; padding:10px 11px; border-radius:16px; min-height:56px;
  }
  .card.compact .c-body {
    flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;
    order:1; text-align:left;
  }
  .card.compact .c-title { font-size:12.5px; line-height:1.2; }
  .card.compact .c-desc { font-size:9.5px; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card.compact .c-ico { order:2; font-size:21px; flex-shrink:0;
    width:34px; height:34px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:#fafafd; box-shadow:inset 0 0 0 1px #f0f0f5; }

  .card.compact.lg {
    gap:10px; padding:16px 16px; border-radius:20px; min-height:82px;
  }
  .card.compact.lg .c-body { gap:4px; min-width:0; }
  .card.compact.lg .c-title { font-size:15px; line-height:1.25; letter-spacing:-.2px; }
  .card.compact.lg .c-desc { font-size:11px; line-height:1.35; }
  .card.compact.lg .c-ico {
    font-size:26px; width:48px; height:48px; border-radius:15px;
    background:#fff6f9; box-shadow:inset 0 0 0 1px #ffe2ec;
    transition:transform .24s cubic-bezier(.2,.9,.3,1);
  }
  .card.compact.lg:active .c-ico { transform:scale(.9) rotate(-6deg); }

  .card.compact.lg.tint-blue   { background:linear-gradient(150deg,#FFFFFF 30%,#F5FAFF 100%); border-color:#E8F2FF; }
  .card.compact.lg.tint-pink   { background:linear-gradient(150deg,#FFFFFF 30%,#FFF6FA 100%); border-color:#FFE7F0; }
  .card.compact.lg.tint-purple { background:linear-gradient(150deg,#FFFFFF 30%,#FAF7FF 100%); border-color:#EFE9FF; }
  .card.compact.lg.tint-orange { background:linear-gradient(150deg,#FFFFFF 30%,#FFFBF2 100%); border-color:#FFF0DB; }

  .card.compact.lg .c-ico.tint-blue   { background:linear-gradient(150deg,#F0F8FF,#DBEBFF);
    box-shadow:inset 0 0 0 1px #C9E2FF, 0 5px 12px rgba(77,150,255,.16); }
  .card.compact.lg .c-ico.tint-pink   { background:linear-gradient(150deg,#FFF4F9,#FFDFEC);
    box-shadow:inset 0 0 0 1px #FFD0E1, 0 5px 12px rgba(255,92,138,.16); }
  .card.compact.lg .c-ico.tint-purple { background:linear-gradient(150deg,#F6F2FF,#E7DDFF);
    box-shadow:inset 0 0 0 1px #DBCCFF, 0 5px 12px rgba(132,94,194,.16); }
  .card.compact.lg .c-ico.tint-orange { background:linear-gradient(150deg,#FFF9EE,#FFEAD0);
    box-shadow:inset 0 0 0 1px #FFDFB7, 0 5px 12px rgba(245,145,30,.16); }

  .c-ico svg { display:block; }

  .pixel-grid { display:grid; gap:1px; background:#ececf2; border-radius:8px; overflow:hidden; width:100%; }
  .pixel-grid > i { width:100%; aspect-ratio:1/1; display:block; }

  .cat-scroll { display:flex; gap:8px; overflow-x:auto; padding:4px 0 10px;
    scrollbar-width:none; margin:0 -18px; padding-left:18px; padding-right:18px; }
  .cat-scroll::-webkit-scrollbar { display:none; }
  .cat-chip { flex-shrink:0; padding:7px 16px; border-radius:30px; background:#f4f4f8;
    color:#6b6b76; font-size:13px; font-weight:600; cursor:pointer; transition:all .18s;
    user-select:none; border:1px solid transparent; }
  .cat-chip.active { background:#ff5c8a; color:#fff; box-shadow:0 6px 14px rgba(255,92,138,.32); border-color:#ff5c8a; }
  .cat-chip:active { transform:scale(.94); }

  .waterfall { column-count:2; column-gap:11px; }
  .wf-item { break-inside:avoid; margin-bottom:11px; background:#fff; border-radius:18px;
    overflow:hidden; border:1px solid #f0f0f5; box-shadow:0 4px 14px rgba(20,20,50,.04);
    cursor:pointer; transition:transform .14s, box-shadow .14s; }
  .wf-item:active { transform:scale(.972); box-shadow:0 8px 22px rgba(20,20,50,.09); }
  .wf-cover { padding:8px; background:#fbfbfe; position:relative; }
  .wf-cover .badge { position:absolute; top:14px; left:14px; z-index:2;
    background:rgba(255,255,255,.92); backdrop-filter:blur(6px); font-size:9px;
    font-weight:700; color:#ff5c8a; padding:3px 8px; border-radius:20px; }
  .wf-photo { width:100%; display:block; border-radius:12px; }
  .detail-photo { width:100%; display:block; border-radius:14px; }
  .wf-body { padding:4px 11px 11px; }
  .wf-title { font-size:13px; font-weight:700; color:#16161a; margin-bottom:7px; line-height:1.3; }
  .wf-user { display:flex; align-items:center; gap:5px; margin-bottom:7px; }
  .mini-avatar { width:18px; height:18px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:9px; color:#fff; font-weight:700; flex-shrink:0; }
  .wf-user span { font-size:10.5px; color:#8e8e98; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wf-stats { display:flex; gap:12px; font-size:11px; color:#8e8e98; }
  .wf-stats .liked { color:#ff4d6d; font-weight:700; }
  .wf-stats .collected { color:#ffa726; font-weight:700; }

  /* 我的作品卡片：不显示作者与点赞收藏，只显示类型与时间 */
  .wf-meta { font-size:10.5px; color:#9a9aa3; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .waterfall.wf-sm { column-gap:9px; }
  .waterfall.wf-sm .wf-item { border-radius:15px; margin-bottom:9px; }
  .waterfall.wf-sm .wf-cover { padding:6px; }
  .waterfall.wf-sm .wf-cover .badge {
    top:10px; left:10px; font-size:7.5px; padding:2px 6px; border-radius:14px;
  }
  .waterfall.wf-sm .wf-photo { border-radius:10px; }
  .waterfall.wf-sm .pixel-grid { border-radius:6px; }
  .waterfall.wf-sm .wf-body { padding:3px 9px 9px; }
  .waterfall.wf-sm .wf-title { font-size:11.5px; margin-bottom:5px; line-height:1.25; }
  .waterfall.wf-sm .wf-user { gap:4px; margin-bottom:5px; }
  .waterfall.wf-sm .mini-avatar { width:15px; height:15px; font-size:7.5px; }
  .waterfall.wf-sm .wf-user span { font-size:9.5px; }
  .waterfall.wf-sm .wf-stats { gap:9px; font-size:10px; }

  .overlay { position:absolute; inset:0; background:#fff; z-index:200;
    display:flex; flex-direction:column; transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1); will-change:transform; }
  .overlay.show { transform:translateX(0); }
  .ov-head { display:flex; align-items:center; gap:10px; padding:16px 18px 10px; flex-shrink:0; }
  .back-btn { width:34px; height:34px; border-radius:50%; background:#f4f4f8;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    cursor:pointer; flex-shrink:0; transition:background .15s; }
  .back-btn:active { background:#e8e8f0; }
  .ov-head .t { font-size:16px; font-weight:700; flex:1; color:#16161a; }
  .ov-scroll { flex:1; overflow-y:auto; padding:0 18px 20px; scrollbar-width:none; }
  .ov-scroll::-webkit-scrollbar { display:none; }

  .detail-cover { padding:16px; background:#fafafd; border-radius:22px;
    border:1px solid #f0f0f5; margin-bottom:16px; }
  .detail-title { font-size:19px; font-weight:800; color:#16161a; margin-bottom:4px; }
  .detail-meta { font-size:11.5px; color:#9a9aa3; margin-bottom:16px; }

  .author-row { display:flex; align-items:center; gap:11px; padding:13px 0;
    border-top:1px solid #f4f4f8; border-bottom:1px solid #f4f4f8; margin-bottom:16px; }
  .author-avatar { width:42px; height:42px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; flex-shrink:0; }
  .author-name { font-size:14px; font-weight:700; color:#16161a; }
  .author-sub { font-size:11px; color:#9a9aa3; margin-top:2px; }
  .follow-btn { padding:7px 18px; border-radius:30px; border:none; background:#ff5c8a;
    color:#fff; font-size:12.5px; font-weight:700; cursor:pointer; transition:all .18s; flex-shrink:0; }
  .follow-btn.following { background:#f0f0f5; color:#7a7a85; }
  .follow-btn:active { transform:scale(.94); }

  .action-bar { display:flex; gap:10px; margin-bottom:20px; }
  .act-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:11px 0; border-radius:16px; background:#f5f5f9; font-size:13px; font-weight:600;
    color:#55555f; cursor:pointer; transition:all .16s; border:none; }
  .act-btn:active { transform:scale(.96); }
  .act-btn.liked { background:#ffe8ef; color:#ff3d63; }
  .act-btn.collected { background:#fff3e0; color:#f59f00; }

  .comment-head { font-size:14px; font-weight:700; color:#16161a; margin-bottom:12px; }
  .comment-item { display:flex; gap:10px; margin-bottom:16px; }
  .cm-avatar { width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; }
  .cm-body { flex:1; }
  .cm-user { font-size:12.5px; font-weight:700; color:#16161a; margin-bottom:3px; }
  .cm-text { font-size:12.5px; color:#55555f; line-height:1.45; }
  .cm-time { font-size:10.5px; color:#b4b4bd; margin-top:4px; }
  .empty-cm { text-align:center; color:#b4b4bd; font-size:12.5px; padding:24px 0; }

  .cm-input-bar { display:flex; gap:9px; padding:10px 18px 24px; border-top:1px solid #f4f4f8;
    background:#fff; flex-shrink:0; }
  .cm-input { flex:1; border:none; background:#f4f4f8; border-radius:30px; padding:11px 18px;
    font-size:13px; outline:none; color:#16161a; }
  .cm-input::placeholder { color:#b4b4bd; }
  .cm-send { padding:0 20px; border-radius:30px; border:none; background:#ff5c8a;
    color:#fff; font-weight:700; font-size:13px; cursor:pointer; transition:all .15s; }
  .cm-send:active { transform:scale(.95); }

  .mask { position:absolute; inset:0; background:rgba(20,20,30,.42); z-index:300;
    display:none; align-items:flex-end; backdrop-filter:blur(2px); }
  .mask.show { display:flex; animation:fadeIn .2s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .sheet { width:100%; background:#fff; border-radius:28px 28px 0 0; padding:22px 20px 30px;
    animation:slideUp .28s cubic-bezier(.2,.9,.3,1); max-height:92%; overflow-y:auto; scrollbar-width:none; }
  .sheet::-webkit-scrollbar { display:none; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .sheet-title { font-size:17px; font-weight:800; color:#16161a; margin-bottom:14px; text-align:center; }
  .field-label { font-size:12.5px; font-weight:700; color:#6b6b76; margin:16px 0 8px; }
  .text-input { width:100%; border:1.5px solid #eeeef4; border-radius:14px; padding:13px 16px;
    font-size:14px; outline:none; transition:border-color .18s; color:#16161a; }
  .text-input:focus { border-color:#ff5c8a; }
  .cat-picker { display:flex; flex-wrap:wrap; gap:8px; }
  .cat-opt { padding:8px 16px; border-radius:30px; background:#f4f4f8; font-size:12.5px;
    font-weight:600; color:#6b6b76; cursor:pointer; transition:all .16s; }
  .cat-opt.active { background:#ff5c8a; color:#fff; }
  .primary-btn { width:100%; padding:15px; border-radius:30px; border:none; background:#ff5c8a;
    color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:22px;
    transition:all .16s; box-shadow:0 8px 18px rgba(255,92,138,.3); }
  .primary-btn:active { transform:scale(.97); }
  .ghost-btn { width:100%; padding:14px; border-radius:30px; border:none; background:#f4f4f8;
    color:#6b6b76; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px; }
  .ghost-btn:active { transform:scale(.97); }

  .result-grid { padding:14px; background:#fafafd; border-radius:20px; border:1px solid #f0f0f5; }

  /* ============ 中央弹窗 ============ */
  .center-mask {
    position:absolute; inset:0; background:rgba(20,20,30,.5); z-index:400;
    display:none; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .center-mask.show { display:flex; animation:fadeIn .2s; }
  .center-dialog {
    width:100%; max-width:340px; background:#fff; border-radius:26px;
    padding:24px 22px 22px; box-shadow:0 30px 60px -12px rgba(0,0,0,.35);
    animation:popIn .28s cubic-bezier(.2,.9,.3,1);
    max-height:88%; overflow-y:auto; scrollbar-width:none;
  }
  .center-dialog::-webkit-scrollbar { display:none; }
  @keyframes popIn { from{transform:scale(.88); opacity:0} to{transform:scale(1); opacity:1} }
  .cd-title { font-size:18px; font-weight:800; color:#16161a; text-align:center; margin-bottom:16px; }
  .cd-preview { padding:10px; background:#fafafd; border-radius:16px; border:1px solid #f0f0f5; margin-bottom:14px; }
  .cd-info { text-align:center; font-size:11px; color:#9a9aa3; margin-bottom:6px; }
  .cd-btn-primary { width:100%; padding:15px; border-radius:30px; border:none; background:#ff5c8a;
    color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px;
    transition:all .16s; box-shadow:0 8px 18px rgba(255,92,138,.3); }
  .cd-btn-primary:active { transform:scale(.97); }
  .cd-btn-secondary { width:100%; padding:15px; border-radius:30px; border:none; background:#ffb0c6;
    color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:10px;
    transition:all .16s; box-shadow:0 8px 18px rgba(255,176,198,.3); }
  .cd-btn-secondary:active { transform:scale(.97); }
  .cd-btn-ghost { width:100%; padding:14px; border-radius:30px; border:none; background:#f4f4f8;
    color:#6b6b76; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px; }
  .cd-btn-ghost:active { transform:scale(.97); }

  /* ============ 裁剪舞台 ============ */
  .crop-img {
    position:absolute; display:block; pointer-events:none;
    -webkit-user-drag:none; max-width:none; max-height:none;
    will-change:transform; transform-origin:center center;
  }
  .crop-box {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.9);
    border-radius:10px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.55);
    pointer-events:none; z-index:5;
    transition:width .22s ease, height .22s ease;
  }
  .crop-box::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.3) calc(33.333% - .5px), rgba(255,255,255,.3) calc(33.333% + .5px), transparent calc(33.333% + .5px)),
      linear-gradient(to right, transparent calc(66.667% - .5px), rgba(255,255,255,.3) calc(66.667% - .5px), rgba(255,255,255,.3) calc(66.667% + .5px), transparent calc(66.667% + .5px)),
      linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.3) calc(33.333% - .5px), rgba(255,255,255,.3) calc(33.333% + .5px), transparent calc(33.333% + .5px)),
      linear-gradient(to bottom, transparent calc(66.667% - .5px), rgba(255,255,255,.3) calc(66.667% - .5px), rgba(255,255,255,.3) calc(66.667% + .5px), transparent calc(66.667% + .5px));
  }
  .crop-box::after {
    content:''; position:absolute; inset:-1px; border-radius:10px;
    pointer-events:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
  }

  .ratio-row { display:flex; gap:8px; flex-wrap:wrap; }
  .ratio-chip { padding:8px 14px; border-radius:30px; background:#f4f4f8; font-size:12px;
    font-weight:700; color:#6b6b76; cursor:pointer; transition:all .16s; }
  .ratio-chip.active { background:#ff5c8a; color:#fff; box-shadow:0 5px 12px rgba(255,92,138,.3); }
  .ratio-chip:active { transform:scale(.94); }

  .slider-row { display:flex; align-items:center; gap:10px; background:#fafafd;
    border:1px solid #f0f0f5; border-radius:16px; padding:8px 14px; }
  .slider-row input[type=range] { flex:1; accent-color:#ff5c8a; height:4px; }
  .slider-val { font-size:11.5px; color:#9a9aa3; width:46px; text-align:right; font-weight:600; }

  .mini-btn { padding:8px 10px; border-radius:20px; border:none; background:#f4f4f8;
    color:#6b6b76; font-size:11.5px; font-weight:600; cursor:pointer; flex:1; transition:all .15s; }
  .mini-btn:active { background:#e8e8f0; transform:scale(.95); }

  .custom-panel { margin-top:12px; padding:14px; background:#fafafd; border-radius:16px;
    border:1px solid #f0f0f5; }

  .preview-canvas { display:block; border-radius:8px;
    box-shadow:0 8px 22px rgba(0,0,0,.12);
    image-rendering: pixelated; image-rendering: crisp-edges; background:#fff; }

  /* ============ 编辑器 ============ */
  .editor-stage {
    position: relative; height: 520px;
    background: linear-gradient(180deg,#f8f8fc 0%,#ebebf2 100%);
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  .editor-stage.pan-mode { cursor: grab; }
  .editor-stage.pan-mode.panning { cursor: grabbing; }

  .editor-float-tools {
    position: absolute; left: 8px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px;
    z-index: 20; padding: 6px 5px;
    background: rgba(255,255,255,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(20,20,50,.16), inset 0 0 0 1px rgba(255,255,255,.7);
    max-height: calc(100% - 20px); overflow-y: auto;

  /* ============ 首页横向轮播 Banner ============ */
  .banner-carousel {
    position: relative; margin: 8px 0 4px; border-radius: 24px;
    overflow: hidden; touch-action: pan-y; user-select: none;
    -webkit-user-select: none; cursor: pointer;
    box-shadow: 0 18px 36px -16px rgba(255,92,138,.55),
                0 6px 16px -8px rgba(20,20,50,.16);
  }
  .banner-track { display: flex; will-change: transform; }
  .banner-slide {
    flex: 0 0 100%; min-height: 156px; padding: 20px 18px 34px;
    display: flex; align-items: center; gap: 13px;
    position: relative; overflow: hidden; box-sizing: border-box;
  }
  .banner-slide::after {
    content:''; position: absolute; right: -44px; bottom: -62px;
    width: 164px; height: 164px; border-radius: 50%;
    background: rgba(255,255,255,.15); pointer-events: none;
  }
  .banner-slide::before {
    content:''; position: absolute; right: 66px; top: -54px;
    width: 106px; height: 106px; border-radius: 50%;
    background: rgba(255,255,255,.10); pointer-events: none;
  }
  .banner-slide .bn-ico {
    width: 62px; height: 62px; flex-shrink: 0; border-radius: 19px;
    background: linear-gradient(150deg, rgba(255,255,255,.42), rgba(255,255,255,.16));
    display: flex; align-items: center; justify-content: center;
    padding: 12px; line-height: 1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75),
                inset 0 -1.5px 0 rgba(0,0,0,.06),
                0 10px 22px rgba(0,0,0,.16);
    position: relative; z-index: 1;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .banner-slide .bn-ico svg { width: 100%; height: 100%; display: block; }
  .banner-slide .bn-body {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;
    position: relative; z-index: 1;
  }
  .banner-slide .bn-title {
    font-size: 18px; font-weight: 800; color: #fff;
    letter-spacing: .3px; line-height: 1.15;
    text-shadow: 0 2px 8px rgba(0,0,0,.16);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .banner-slide .bn-desc {
    font-size: 11.5px; color: rgba(255,255,255,.96);
    line-height: 1.5; font-weight: 600; letter-spacing: .1px;
    white-space: normal; text-shadow: 0 1px 5px rgba(0,0,0,.14);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-all;
  }
  .banner-slide .bn-go {
    flex-shrink: 0; padding: 9px 15px; border-radius: 22px;
    background: rgba(255,255,255,.97);
    font-size: 12.5px; font-weight: 800;
    position: relative; z-index: 1; white-space: nowrap;
    letter-spacing: .2px;
    box-shadow: 0 6px 14px rgba(0,0,0,.16), inset 0 -1px 0 rgba(0,0,0,.04);
    transition: transform .18s;
  }
  .banner-slide:active .bn-go { transform: scale(.94); }

  .banner-dots {
    position: absolute; left: 0; right: 0; bottom: 12px;
    display: flex; justify-content: center; gap: 5px;
    z-index: 3; pointer-events: none;
  }
  .banner-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,.55);
    transition: all .28s cubic-bezier(.4,0,.2,1);
  }
  .banner-dot.active { width: 18px; border-radius: 3px; background: #fff; }

  /* ============ 搜索页 ============ */
  #detailOverlay { z-index: 260; }

  .search-bar {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px; background: #f4f4f8;

    transition: border-color .18s, background .18s;

  .search-bar:focus-within { border-color: #ffd0de; background: #fff; }
  .search-bar input {

  .hot-tags { display: flex; flex-wrap: wrap; gap: 8px; }

  .history-row {

  .history-row .hr-ico { font-size: 13px; color: #c4c4ce; }
  .history-row .hr-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-row .hr-del { font-size: 12px; color: #c4c4ce; padding: 2px 6px; }

  .user-result {
    display: flex; align-items: center; gap: 11px;

  .ur-avatar {

  /* ============ 我的页面：列表卡片 ============ */
  .my-list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px; background: #fff; border: 1px solid #f0f0f5;

  .my-list-item .mli-ico {

  .my-list-item .mli-title { font-size: 14.5px; font-weight: 700; color: #16161a; margin-bottom: 3px; }
  .my-list-item .mli-sub { font-size: 11.5px; color: #9a9aa3; }
  .my-list-item .mli-arrow { font-size: 18px; color: #c4c4ce; font-weight: 700; }

  /* ============ 素材库页面 ============ */
  .material-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px;
  }
  .material-card {
    background: #fff; border-radius: 20px; overflow: hidden;
    border: 1px solid #f0f0f5; box-shadow: 0 4px 14px rgba(20,20,50,.04);
    cursor: pointer; transition: transform .14s, box-shadow .14s;
  }
  .material-card:active { transform: scale(.972); box-shadow: 0 8px 22px rgba(20,20,50,.09); }
  .material-card .mc-cover {
    padding: 10px; background: #fbfbfe;
  }
  .material-card .mc-body {
    padding: 8px 12px 12px;
  }
  .material-card .mc-title {
    font-size: 13.5px; font-weight: 700; color: #16161a; margin-bottom: 4px;
  }
  .material-card .mc-meta {
    font-size: 10.5px; color: #9a9aa3;
  }
  .material-card .mc-tag {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    background: #fff0f5; color: #ff5c8a; font-size: 9.5px; font-weight: 700;
    margin-top: 6px;
  }

  /* ============ 图纸解析页 ============ */
  .parse-upload-box {
    background: linear-gradient(150deg, #fff8fb, #f6f2ff);
    border: 2px dashed #f0d0de; border-radius: 24px;
    padding: 32px 20px; display: flex; flex-direction: column;
    align-items: center; gap: 10px; cursor: pointer;
    transition: all .2s; text-align: center;
  }
  .parse-upload-box:active { background: #fff0f5; border-color: #ff9dbb; }
  .parse-upload-box .pu-ico { font-size: 42px; line-height: 1; }
  .parse-upload-box .pu-title {
    font-size: 15px; font-weight: 800; color: #16161a;
  }
  .parse-upload-box .pu-sub {
    font-size: 11.5px; color: #9a9aa3; line-height: 1.5;
  }
  .parse-link-input {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .parse-link-input input {
    flex: 1; padding: 13px 16px; border-radius: 14px;
    border: 1.5px solid #eeeef4; font-size: 13px;
    outline: none; transition: border-color .18s; color: #16161a;
    font-family: inherit;
  }
  .parse-link-input input:focus { border-color: #ff5c8a; }
  .parse-link-input input::placeholder { color: #b4b4bd; }
  .parse-link-input button {
    padding: 0 20px; border-radius: 14px; border: none;
    background: #ff5c8a; color: #fff; font-weight: 700;
    font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: all .15s; font-family: inherit;
  }
  .parse-link-input button:active { transform: scale(.95); }

  .parse-platform-hint {
    display: flex; gap: 8px; margin-top: 14px; justify-content: center;
    flex-wrap: wrap;
  }
  .parse-platform-hint span {
    padding: 6px 14px; border-radius: 20px; background: #fafafd;
    border: 1px solid #f0f0f5; font-size: 11px; color: #6b6b76;
    font-weight: 600;
  }

  /* ============ 下载列表项 ============ */
  .download-item {
    display: flex; gap: 12px; padding: 14px;
    background: #fff; border: 1px solid #f0f0f5;
    border-radius: 18px; margin-bottom: 11px;
    cursor: pointer; transition: transform .14s;
  }
  .download-item:active { transform: scale(.98); background: #fff8fa; }
  .dl-cover {
    width: 64px; flex-shrink: 0; padding: 5px;
    background: #fafafd; border-radius: 12px;
    border: 1px solid #f0f0f5;
  }
  .dl-cover .pixel-grid { border-radius: 6px; }
  .dl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dl-title { font-size: 13.5px; font-weight: 700; color: #16161a; margin-bottom: 3px; }
  .dl-meta { font-size: 10.5px; color: #9a9aa3; margin-bottom: 8px; }
  .dl-actions { display: flex; gap: 7px; margin-top: auto; }
  .dl-actions .mini-btn { padding: 6px 0; font-size: 11px; }

  /* ============ 解析多图选择 ============ */
  .parsed-images-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    margin-bottom: 16px;
  }
  .parsed-img-item {
    position: relative; border-radius: 16px; overflow: hidden;
    border: 2px solid transparent; cursor: pointer;
    transition: all .18s; background: #fafafd;
  }
  .parsed-img-item.selected { border-color: #ff5c8a; box-shadow: 0 6px 18px rgba(255,92,138,.25); }
  .parsed-img-item .pi-inner {
    padding: 8px; display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1/1; background: #fff;
  }
  .parsed-img-item .pi-inner img {
    max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px;
  }
  .parsed-img-item .pi-label {
    position: absolute; top: 6px; left: 6px;
    background: rgba(255,255,255,.92); font-size: 9px; font-weight: 700;
    color: #16161a; padding: 2px 8px; border-radius: 20px;
    backdrop-filter: blur(4px);
  }
  .parsed-img-item.selected .pi-label {
    background: #ff5c8a; color: #fff;
  }
  .parsed-img-item .pi-check {
    position: absolute; top: 6px; right: 6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2px solid #dcdce6;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; transition: all .18s;
  }
  .parsed-img-item.selected .pi-check {
    background: #ff5c8a; border-color: #ff5c8a;
  }

  /* ============ 色号匹配 / 网格校准 ============ */
  .match-stage {
    position: relative; background: #151519; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    flex: 1 1 0; min-height: 0; padding: 12px;
  }
  .match-canvas-wrap {
    position: relative; display: inline-block;
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,.35);
    background: #fff; border: 1px solid #e8e8f0;
  }
  .match-canvas-wrap canvas {
    display: block; image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .match-canvas-wrap.original canvas {
    image-rendering: auto;
  }
  .match-canvas-wrap::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(0,0,0,.12) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,.12) 1px, transparent 1px);
    background-size: calc(100% / var(--cols)) calc(100% / var(--rows));
  }
  .match-canvas-wrap.no-grid::after { display:none; }

  .match-toolbar {
    display: flex; gap: 8px; padding: 10px 18px 0;
    flex-shrink: 0; flex-wrap: wrap;
    align-items: center;
  }
  .match-toolbar .mt-label {
    font-size: 11px; font-weight: 700; color: #6b6b76;
  }
  .match-toolbar input[type=number] {
    width: 58px; padding: 7px 8px; border-radius: 10px;
    border: 1.5px solid #eeeef4; font-size: 13px;
    outline: none; text-align: center; color: #16161a;
    font-family: inherit;
  }
  .match-toolbar input[type=number]:focus { border-color: #ff5c8a; }
  .match-toolbar .mt-step-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: #f4f4f8; color: #6b6b76; font-size: 15px;
    font-weight: 700; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0; padding: 0; line-height: 1;
  }
  .match-toolbar .mt-step-btn:active { background: #ffe8ef; color: #ff3d63; transform: scale(.9); }

  /* 图纸网格（真实图纸样式） */
  .real-pattern-wrap {
    position: relative; display: inline-block;
    background: #fff; border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    overflow: hidden;
  }
  .real-pattern-grid {
    display: grid; gap: 0;
    background: #f0f0f5;
    border: 1.5px solid #dcdce6;
  }
  .real-pattern-grid > .rp-cell {
    width: 100%; aspect-ratio: 1/1; display: flex;
    align-items: center; justify-content: center;
    font-size: 7px; font-weight: 700; color: rgba(0,0,0,.5);
    line-height: 1; overflow: hidden; position: relative;
    border-right: 0.5px solid rgba(0,0,0,.06);
    border-bottom: 0.5px solid rgba(0,0,0,.06);
  }
  .real-pattern-grid > .rp-cell.highlight {
    outline: 2px solid #ff5c8a; outline-offset: -1px;
    z-index: 2; box-shadow: inset 0 0 0 9999px rgba(255,92,138,.18);
  }

  /* 图纸容器（带行列号） */
  .pattern-board {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8px;
  }
  .pattern-matrix-wrap {
    display: flex; align-items: flex-start;
  }
  .pattern-col-labels {
    display: flex; margin-left: 18px; margin-bottom: 3px;
  }
  .pattern-col-labels span {
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; font-weight: 700; color: #9a9aa3;
    width: var(--cell-size, 18px);
  }
  .pattern-row-labels {
    display: flex; flex-direction: column;
    margin-right: 3px; justify-content: flex-start;
  }
  .pattern-row-labels span {
    display: flex; align-items: center; justify-content: flex-end;
    font-size: 7px; font-weight: 700; color: #9a9aa3;
    height: var(--cell-size, 18px); padding-right: 3px;
  }

  /* ============ 色号清单 ============ */
  .color-list-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 14px;
    background: #fff; border: 1.5px solid #f0f0f5;
    margin-bottom: 8px; cursor: pointer;
    transition: all .16s;
  }
  .color-list-item:active { transform: scale(.98); }
  .color-list-item.active { border-color: #ff5c8a; background: #fff8fa; box-shadow: 0 4px 12px rgba(255,92,138,.15); }
  .color-list-item .cl-swatch {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);

  .color-list-item .cl-info { flex: 1; min-width: 0; }
  .color-list-item .cl-code {

    font-size: 11px; color: #9a9aa3; margin-top: 2px;

  .color-list-item .cl-replace {
    font-size: 11px; font-weight: 700; color: #ff5c8a;
    padding: 5px 12px; border-radius: 20px;

    flex-shrink: 0; transition: all .15s; font-family: inherit;
  }
  .color-list-item .cl-replace:active { transform: scale(.94); background: #ffe2ee; }

  /* 替换色选择面板 */
  .replace-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fff; border-radius: 24px 24px 0 0;
    box-shadow: 0 -10px 40px rgba(20,20,50,.18);
    z-index: 80; padding: 18px 18px 28px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 62%; overflow-y: auto; scrollbar-width: none;
  }
  .replace-panel.show { transform: translateY(0); }
  .replace-panel::-webkit-scrollbar { display: none; }
  .replace-panel .rp-title {
    font-size: 15px; font-weight: 800; color: #16161a;
    margin-bottom: 14px; text-align: center;
    display: flex; align-items: center; justify-content: space-between;
  }
  .replace-panel .rp-title .rp-close {
    width: 26px; height: 26px; border-radius: 50%; border: none;

  .replace-panel .rp-swatches {

  .replace-panel .rp-swatch {

    position: relative;

  .replace-panel .rp-swatch:active { transform: scale(.88); }
  .replace-panel .rp-swatch.selected { border-color: #16161a; transform: scale(1.1); }

    margin: 16px 0 8px;

  .preview-stat-row .ps-item { text-align: center; }
  .preview-stat-row .ps-item .ps-num {

  .preview-stat-row .ps-item .ps-label {
    font-size: 10.5px; color: #9a9aa3; margin-top: 2px;
  }

  /* ============ 新增：预览页网格样式 ============ */
  .pattern-preview-wrap {
    position: relative; display: inline-block;
    background: #fff; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.1);
    overflow: hidden; margin: 0 auto;

  .pattern-preview-grid {
    display: grid; gap: 0;
    background: #f0f0f5;
    border: 1.5px solid #dcdce6;
  }
  .pattern-preview-grid .pp-cell {
    width: 100%; aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; color: rgba(0,0,0,.45);
    line-height: 1; overflow: hidden;
    border-right: 0.5px solid rgba(0,0,0,.06);

  .pattern-preview-grid .pp-cell:active {

  .pattern-preview-grid .pp-cell.highlight {

    color: inherit; pointer-events: none;

  .pattern-preview-grid .pp-cell.show-code .pp-code {
    display: block;
  }

function seedRand(s){ const x=Math.sin(s*12.9898)*43758.5453; return x-Math.floor(x); }
function pixelGridHTML(seed, cols, rows){
  rows = rows || cols; let h='';
  for(let i=0;i<cols*rows;i++){
    const r1=seedRand(seed+i*3.71), r2=seedRand(seed+i*7.13+99);
    h += `<i style="background:${r2<.14?'#fff':PALETTE[Math.floor(r1*PALETTE.length)]}"></i>`;
  }
  return h;
}
function gridFromColors(colors){ return colors.map(c=>`<i style="background:${c}"></i>`).join(''); }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function hexToRgbArr(hex){
  const h = (hex || '#ffffff').replace('#','');
  return {
    r: parseInt(h.slice(0,2),16) || 0,
    g: parseInt(h.slice(2,4),16) || 0,
    b: parseInt(h.slice(4,6),16) || 0

function artworkGridHTML(a){ return a.customColors ? gridFromColors(a.customColors) : pixelGridHTML(a.seed, a.size, a.rows||a.size); }

/* 由 seed 还原一组像素颜色（与 pixelGridHTML 一致） */
function colorsFromSeed(seed, size){
  const colors = [];
  for(let i=0;i<size*size;i++){
    const r1 = seedRand(seed + i*3.71), r2 = seedRand(seed + i*7.13 + 99);
    colors.push(r2 < 0.14 ? '#ffffff' : PALETTE[Math.floor(r1*PALETTE.length)]);
  }
  return colors;
}

function roundRectPath(ctx, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

  const stage = document.getElementById('cropStage');

  const w = stage.clientWidth;
  const h = stage.clientHeight;

  if(h > 0) CROP_STAGE_H = h;
}

/* ---------- 首页 Banner 轮播逻辑 ---------- */
function setupHomeBanner(){
  const carousel = document.getElementById('homeBanner');
  const track = document.getElementById('homeBannerTrack');
  if(!carousel || !track) return;

  const slides = Array.from(track.querySelectorAll('.banner-slide'));
  const dots = Array.from(carousel.querySelectorAll('.banner-dot'));
  if(!slides.length) return;

  let idx = 0;
  let dragging = false;
  let startX = 0;
  let dx = 0;
  let moved = false;

  const apply = (offsetPx, anim)=>{
    track.style.transition = anim ? 'transform .42s cubic-bezier(.4,0,.2,1)' : 'none';
    track.style.transform = `translateX(calc(${-idx * 100}% + ${offsetPx}px))`;
  };

  const goTo = (i, anim=true)=>{
    idx = (i + slides.length) % slides.length;
    apply(0, anim);
    dots.forEach((d,k)=> d.classList.toggle('active', k === idx));
  };

  const startAuto = ()=>{
    clearInterval(homeBannerTimer);
    if(slides.length < 2) return;
    homeBannerTimer = setInterval(()=> goTo(idx + 1), 3500);
  };

  const stopAuto = ()=> clearInterval(homeBannerTimer);

  goTo(0, false);
  startAuto();

  const onMove = (e)=>{
    if(!dragging) return;
    dx = e.clientX - startX;
    if(Math.abs(dx) > 6) moved = true;
    apply(dx, false);
  };

  const onUp = ()=>{
    if(!dragging) return;
    dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);

    if(Math.abs(dx) > 46){
      goTo(dx < 0 ? idx + 1 : idx - 1);
    } else {
      goTo(idx);
    }
    dx = 0;
    startAuto();
  };

  carousel.addEventListener('pointerdown', e=>{
    dragging = true; moved = false;
    startX = e.clientX; dx = 0; stopAuto();
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  carousel.addEventListener('click', e=>{
    if(moved){ e.stopPropagation(); e.preventDefault(); }
  }, true);

  slides.forEach(s=>{
    s.addEventListener('click', ()=>{
      const key = s.dataset.bn;
      if(key === 'parse'){ openParsePage(); }
      else if(key === 'pattern'){ pickImage(img => startCropFlow(img, 'pattern')); }
      else if(key === 'q'){ pickImage(img => startCropFlow(img, 'q')); }
    });
  });

  if(!window._bannerVisBound){
    window._bannerVisBound = true;
    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden) clearInterval(homeBannerTimer);
    });
  }
}

      <div style="height:24px;"></div>
    </div>
  `;
  listOverlay.classList.add('show');

  document.getElementById('mdBack').onclick = close;
  document.getElementById('mdBackBottom').onclick = close;

  document.getElementById('mdDownload').onclick = ()=>{
    const btn = document.getElementById('mdDownload');
    if(downloads.some(d=>d.title === m.title)){
      close();
      setTimeout(()=> openDownloadList(), 260);

    }
    downloadMaterial(m);

  };
}

/* ---------- 下载素材 ---------- */
function downloadMaterial(m){
  const exists = downloads.find(d=>d.title === m.title);
  if(exists){
    showToast(`📥 「${m.title}」已在下载列表中`);
    return false;
  }
  downloads.unshift({
    id: 'dl' + (state.nextId++),
    title: m.title,
    category: m.category,
    seed: m.seed,
    size: m.size,
    time: '刚刚',
    source: '素材库'
  });
  showToast(`📥 已下载「${m.title}」`);
  return true;
}

============================================================ */
function pushSearchHistory(kw){
  kw = (kw || '').trim();
  if(!kw) return;
  searchHistory = [kw, ...searchHistory.filter(h=>h !== kw)].slice(0, 8);
}

function openSearchPage(){
  listOverlay.innerHTML = `
    <div class="ov-head" style="padding-bottom:8px;">
      <div class="search-bar">
        <span style="font-size:13px;color:#9a9aa3;line-height:1;">🔍</span>

        <div class="search-clear" id="searchClear">✕</div>
      </div>
      <div class="search-cancel" id="searchCancel">取消</div>
    </div>
    <div class="ov-scroll" id="searchScroll" style="padding-top:0;"></div>
  `;
  listOverlay.classList.add('show');

  const input    = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  const scrollBox= document.getElementById('searchScroll');

  const renderIdle = ()=>{
    scrollBox.innerHTML = `
      <div class="search-sec-title">🔥 热门搜索</div>
      <div class="hot-tags">
        ${HOT_SEARCH.map(t=>`<div class="hot-tag" data-kw="${t}">${t}</div>`).join('')}
      </div>
      ${searchHistory.length ? `
        <div class="search-sec-title">🕘 搜索历史 <span id="clearHistory">清空</span></div>
        ${searchHistory.map(h=>`
          <div class="history-row" data-kw="${h}">
            <span class="hr-ico">🕘</span>
            <span class="hr-txt">${h}</span>
            <span class="hr-del">✕</span>
          </div>
        `).join('')}
      ` : ''}
      <div style="height:20px;"></div>
    `;

    scrollBox.querySelectorAll('[data-kw]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        if(e.target.classList.contains('hr-del')){
          e.stopPropagation();
          searchHistory = searchHistory.filter(h=>h !== el.dataset.kw);
          renderIdle(); return;
        }
        input.value = el.dataset.kw;
        input.dispatchEvent(new Event('input'));
      });
    });

    const ch = document.getElementById('clearHistory');
    if(ch) ch.onclick = ()=>{ searchHistory = []; renderIdle(); showToast('🕘 已清空搜索历史'); };
  };

  const renderResults = (kw)=>{
    const k = kw.trim().toLowerCase();

    const mats = materials.filter(m=>{
      const hay = `${m.title||''}|${m.category||''}|${(m.tags||[]).join('|')}`.toLowerCase();
      return hay.includes(k);
    });

    const authorMap = {};
    artworks.forEach(a=>{
      if(a.published === false) return;
      if(!authorMap[a.author]) authorMap[a.author] = { name:a.author, color:a.avatarColor, count:0 };
      authorMap[a.author].count++;
    });
    const users = Object.values(authorMap).filter(u=>u.name.toLowerCase().includes(k));

    if(!mats.length && !users.length){
      scrollBox.innerHTML = `
        <div class="empty-state">
          <div class="es-ico">🔍</div>
          <div class="es-t">没有找到「${kw}」相关的内容</div>
          <div class="es-s">换个关键词试试，比如「柴犬」「美食」</div>
        </div>`;
      return;
    }

    scrollBox.innerHTML = `
      ${users.length ? `
        <div class="search-sec-title">👤 创作者
          <span style="color:#9a9aa3;">${users.length} 位</span>
        </div>
        ${users.map(u=>`
          <div class="user-result" data-author="${u.name}">
            <div class="ur-avatar" style="background:${u.color}">${u.name[0]}</div>
            <div style="flex:1;min-width:0;">
              <div class="ur-name">${u.name}</div>
              <div class="ur-sub">拼豆创作者 · ${u.count} 作品</div>
            </div>
            <div style="font-size:16px;color:#c4c4ce;">›</div>
          </div>
        `).join('')}
      ` : ''}

      ${mats.length ? `
        <div class="search-sec-title">🖼️ 相关素材
          <span style="color:#9a9aa3;">${mats.length} 个</span>
        </div>
        <div class="material-grid" id="searchGrid">${mats.map(m=>materialCardHTML(m)).join('')}</div>
      ` : ''}
      <div style="height:16px;"></div>
    `;

    if(mats.length) bindWaterfall('searchGrid', true);

    scrollBox.querySelectorAll('[data-author]').forEach(el=>{
      el.addEventListener('click', ()=>{
        input.value = el.dataset.author;
        input.dispatchEvent(new Event('input'));
      });
    });
  };

  input.addEventListener('input', ()=>{
    const kw = input.value;
    clearBtn.classList.toggle('show', !!kw.trim());
    if(!kw.trim()) renderIdle();
    else renderResults(kw);
  });

  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      const kw = input.value.trim();
      if(!kw) return;
      pushSearchHistory(kw);
      input.blur();
      renderResults(kw);
    }
  });

  clearBtn.onclick = ()=>{
    input.value = ''; clearBtn.classList.remove('show');
    renderIdle();
    try{ input.focus(); }catch(_){}
  };

  document.getElementById('searchCancel').onclick = ()=> listOverlay.classList.remove('show');

  renderIdle();
  setTimeout(()=>{ try{ input.focus(); }catch(_){} }, 160);
}

/* ============================================================
   选图
============================================================ */
function pickImage(cb){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>cb(img);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ============================================================
   链接解析 · 多图选择
============================================================ */
function simulateParseFromLink(link){
  const scrollBox = editorOverlay.querySelector('.ov-scroll');
  if(!scrollBox) return;

  let platform = '链接';
  let platformIcon = '🔗';
  if(link.includes('xiaohongshu') || link.includes('xhslink')){ platform = '小红书'; platformIcon = '📕'; }
  else if(link.includes('weibo')){ platform = '微博'; platformIcon = '🟡'; }
  else if(link.includes('douyin')){ platform = '抖音'; platformIcon = '🎵'; }

  scrollBox.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;">
      <div style="font-size:56px;margin-bottom:20px;">${platformIcon}</div>
      <div style="font-size:16px;font-weight:800;color:#16161a;margin-bottom:8px;">正在解析${platform}链接…</div>
      <div style="font-size:12.5px;color:#9a9aa3;line-height:1.6;">
        抓取笔记图片<br>识别拼豆图纸<br>生成可编辑图纸
      </div>
      <div style="margin-top:28px;width:200px;height:4px;background:#f0f0f5;border-radius:2px;overflow:hidden;">
        <div id="parseProgressBar" style="width:0%;height:100%;background:linear-gradient(90deg,#ff9dbb,#ff5c8a);border-radius:2px;transition:width .3s;"></div>
      </div>
      <div style="margin-top:16px;font-size:11px;color:#b4b4bd;" id="parseLinkStatus">正在连接…</div>
    </div>
  `;

  const statusEl = document.getElementById('parseLinkStatus');
  const bar = document.getElementById('parseProgressBar');
  let progress = 0;

  const steps = [
    { at: 20, text: '正在获取笔记内容…' },
    { at: 45, text: '发现 6 张图片，正在下载…' },
    { at: 70, text: '正在识别网格与色号…' },
    { at: 90, text: '生成拼豆图纸中…' }
  ];

  const timer = setInterval(()=>{
    progress += 8 + Math.random() * 14;
    if(progress > 100) progress = 100;
    if(bar) bar.style.width = progress + '%';
    steps.forEach(s => { if(progress >= s.at && statusEl) statusEl.textContent = s.text; });
    if(progress >= 100){
      clearInterval(timer);
      setTimeout(()=>{
        const imgs = [];
        for(let k=0;k<6;k++){
          const c = document.createElement('canvas');
          c.width = 400; c.height = 400;
          const cx = c.getContext('2d');
          const grad = cx.createLinearGradient(0,0,400,400);
          const hues = [330, 200, 40, 160, 270, 20];
          grad.addColorStop(0, `hsl(${hues[k]}, 80%, 85%)`);
          grad.addColorStop(1, `hsl(${hues[k]}, 70%, 65%)`);
          cx.fillStyle = grad;
          cx.fillRect(0,0,400,400);
          for(let y=0;y<20;y++){
            for(let x=0;x<20;x++){
              if(Math.random() > 0.5){
                cx.fillStyle = PALETTE[Math.floor(Math.random()*PALETTE.length)];
                cx.fillRect(x*20, y*20, 20, 20);
              }
            }
          }
          cx.fillStyle = 'rgba(255,255,255,.85)';
          cx.font = 'bold 80px sans-serif';
          cx.textAlign = 'center';
          cx.textBaseline = 'middle';
          cx.fillText(k+1, 200, 200);
          imgs.push({ src: c.toDataURL(), selected: k===0 });
        }
        parseState.images = imgs;
        parseState.selectedIdx = 0;
        showParseImageSelect(platform);
      }, 400);
    }
  }, 180);
}

/* ============================================================
   生成匹配颜色（采样 + 颜色量化）
============================================================ */
function generateMatchedColors(){
  const { cols, rows, originalImage, offsetX, offsetY, brand } = parseState;
  const iw = originalImage.naturalWidth;
  const ih = originalImage.naturalHeight;

  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = iw; srcCanvas.height = ih;
  const sctx = srcCanvas.getContext('2d');
  sctx.drawImage(originalImage, offsetX, offsetY, iw, ih, 0, 0, iw, ih);

  const sample = document.createElement('canvas');
  sample.width = cols; sample.height = rows;
  const sampCtx = sample.getContext('2d');
  sampCtx.imageSmoothingEnabled = true;
  sampCtx.imageSmoothingQuality = 'high';
  sampCtx.drawImage(srcCanvas, 0, 0, cols, rows);
  const imgData = sampCtx.getImageData(0, 0, cols, rows);
  const data = imgData.data;

  const brandColors = (BRAND_COLORS[brand] || PALETTE).map(hexToRgbArr);
  const brandHexes = BRAND_COLORS[brand] || PALETTE;

  const colors = [];
  for(let i=0;i<cols*rows;i++){
    let r = data[i*4], g = data[i*4+1], b = data[i*4+2];

    if(r > 240 && g > 240 && b > 240){
      colors.push('#ffffff');
      continue;
    }

    let bestDist = Infinity, bestIdx = 0;
    for(let k=0;k<brandColors.length;k++){
      const bc = brandColors[k];
      const dr = r - bc.r, dg = g - bc.g, db = b - bc.b;
      const dist = dr*dr + dg*dg + db*db;
      if(dist < bestDist){ bestDist = dist; bestIdx = k; }
    }
    colors.push(brandHexes[bestIdx]);
  }

  parseState.colors = colors;
  parseState.matchedCanvas = srcCanvas;
}

/* ============================================================
   对比预览页
============================================================ */
function renderComparePage(){
  const { cols, rows, colors } = parseState;
  const stats = computeBeanStats(colors);

  function getColorName(hex) {
    return COLOR_NAMES[hex] || shortHex(hex);
  }

  function getLabel(hex) {
    const name = COLOR_NAMES[hex];
    if(name) return name.replace(/^\S+\s/, '').slice(0,2);
    return shortHex(hex).slice(1,3);
  }

  function isLight(hex){
    const {r,g,b} = hexToRgbArr(hex);
    return (r*0.299 + g*0.587 + b*0.114) > 180;
  }

  function buildPreviewGrid(colorsArr, c, r, showCode, highlightHex) {
    let html = '<div class="pattern-preview-grid" style="grid-template-columns:repeat(' + c + ',1fr); width:100%;">';
    for(let i=0;i<c*r;i++){
      const hex = colorsArr[i] || '#ffffff';
      const isHighlight = highlightHex && (
        Math.abs(hexToRgbArr(hex).r - hexToRgbArr(highlightHex).r) < 30 &&
        Math.abs(hexToRgbArr(hex).g - hexToRgbArr(highlightHex).g) < 30 &&
        Math.abs(hexToRgbArr(hex).b - hexToRgbArr(highlightHex).b) < 30
      );
      const label = getLabel(hex);
      const light = isLight(hex);
      html += `<div class="pp-cell ${showCode?'show-code':''} ${isHighlight?'highlight':''}" 
        style="background:${hex}; color:${light ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.8)'};"
        data-idx="${i}" data-color="${hex}">
        <span class="pp-code">${label}</span>
      </div>`;
    }
    html += '</div>';
    return html;
  }

  function buildOriginalCanvas() {
    const { originalImage, offsetX, offsetY } = parseState;
    const canvas = document.createElement('canvas');
    canvas.width = originalImage.naturalWidth;
    canvas.height = originalImage.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(originalImage, offsetX, offsetY, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL();
  }

  let currentView = 'work';
  let showCode = false;
  let highlightHex = parseState.highlightColor || null;

  function renderBody() {
    const body = document.getElementById('cmpBody');
    if (!body) return;

    const brandColors = BRAND_COLORS[parseState.brand] || PALETTE;

      <div class="preview-stat-card">

          <span class="psc-title">${parseState.brand} 色号</span>

        </div>
        <div class="psc-grid">
          <div class="psc-item">
            <div class="psc-num">${cols}×${rows}</div>
            <div class="psc-label">网格</div>
          </div>
          <div class="psc-item">
            <div class="psc-num pink">${stats.beansUsed}</div>
            <div class="psc-label">用豆量</div>
          </div>
          <div class="psc-item">
            <div class="psc-num orange">${stats.colorCount}</div>
            <div class="psc-label">颜色数</div>
          </div>
        </div>
      </div>
    `;

    const colorListHTML = stats.colors.map(c => {
      const name = getColorName(c.color);
      return `
        <div class="color-list-item" data-color="${c.color}">
          <div class="cl-swatch" style="background:${c.color};"></div>
          <div class="cl-info">
            <div class="cl-code">${name}</div>
            <div class="cl-count">${c.count} 颗</div>
          </div>
          <button class="cl-replace" data-color="${c.color}">替换</button>
        </div>
      `;
    }).join('');

    let gridHTML = '';
    if (currentView === 'work') {
      gridHTML = buildPreviewGrid(colors, cols, rows, showCode, highlightHex);
    } else {
      const originalDataURL = buildOriginalCanvas();
      gridHTML = `<img src="${originalDataURL}" style="width:100%;display:block;border-radius:8px;image-rendering:auto;" alt="原图">`;

    body.innerHTML = `
      <!-- 视图切换 -->
      <div style="display:flex;gap:6px;background:#f4f4f8;border-radius:16px;padding:4px;margin:6px 0 12px;">
        <div class="seg-tab ${currentView==='original'?'active':''}" data-view="original" style="flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:13px;font-weight:700;color:${currentView==='original'?'#ff5c8a':'#6b6b76'};cursor:pointer;transition:all .18s;user-select:none;background:${currentView==='original'?'#fff':'transparent'};box-shadow:${currentView==='original'?'0 2px 8px rgba(20,20,50,.08)':'none'};">原图</div>

    body.querySelectorAll('[data-view]').forEach(el => {

    });

    const toggleBtn = body.querySelector('#toggleCodeBtn');
    if (toggleBtn) {
      toggleBtn.onclick = () => { showCode = !showCode; renderBody(); };
    }

    body.querySelectorAll('.brand-chip').forEach(el => {
      el.onclick = () => {
        parseState.brand = el.dataset.brand;
        generateMatchedColors();
        renderComparePage();
      };
    });

    body.querySelectorAll('.package-chip').forEach(el => {

function computeBeanStats(colors){
  const total = colors.length;
  const freq = {};
  colors.forEach(c=>{ freq[c] = (freq[c]||0)+1; });
  const usedColors = Object.keys(freq).filter(c=>c!=='#ffffff');
  usedColors.sort((a,b)=>freq[b]-freq[a]);
  const beansUsed = total - (freq['#ffffff']||0);
  return {
    total, beansUsed,
    colorCount: usedColors.length,
    colors: usedColors.map(c=>({ color:c, count:freq[c] })),
    freq
  };
}

function shortHex(hex){
  const c = hex.replace('#','');
  return '#' + c[0] + c[2] + c[4];
}

function renderBeanStatsHTML(stats){
  const { beansUsed, colorCount, colors } = stats;
  const colorCells = colors.map(c => `

      <div class="color-count">×${c.count}</div>

  `).join('');

  return `

      <div class="bs-left">
        <div class="bs-item">
          <span class="label">颜色</span>
          <span class="num orange">${colorCount}</span>

  `;
}

function updateCropBoxSize(){
  const r = cropState.ratio;
  const SW = CROP_STAGE_W;
  const SH = CROP_STAGE_H;
  let w, h;
  if(SW / SH >= r){ h = SH; w = h * r; }
  else { w = SW; h = w / r; }
  cropState.boxW = Math.round(w);
  cropState.boxH = Math.round(h);
  const box = document.getElementById('cropBox');
  if(box){
    box.style.width = cropState.boxW + 'px';
    box.style.height = cropState.boxH + 'px';
  }
}

function updateCropImage(){
  const img = cropState.img;
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;

  const baseScale = Math.max(CROP_STAGE_W / iw, CROP_STAGE_H / ih);
  cropState.dw = iw * baseScale;
  cropState.dh = ih * baseScale;

  const maxOx = Math.max(0, (cropState.dw * cropState.zoom - cropState.boxW) / 2);
  const maxOy = Math.max(0, (cropState.dh * cropState.zoom - cropState.boxH) / 2);
  cropState.ox = Math.max(-maxOx, Math.min(maxOx, cropState.ox));
  cropState.oy = Math.max(-maxOy, Math.min(maxOy, cropState.oy));

  const el = document.getElementById('cropImg');
  if(!el) return;
  el.style.width = cropState.dw + 'px';
  el.style.height = cropState.dh + 'px';
  el.style.left = ((CROP_STAGE_W - cropState.dw) / 2) + 'px';
  el.style.top = ((CROP_STAGE_H - cropState.dh) / 2) + 'px';
  el.style.transformOrigin = 'center center';
  el.style.transform = `translate(${cropState.ox}px, ${cropState.oy}px) rotate(${cropState.rotation}deg) scale(${cropState.zoom})`;
}

function bindCropEvents(){
  const stage = document.getElementById('cropStage');
  if(!stage) return;
  let drag = null;

  stage.addEventListener('pointerdown', e=>{
    drag = { x:e.clientX, y:e.clientY, ox:cropState.ox, oy:cropState.oy };
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  });
  stage.addEventListener('pointermove', e=>{
    if(!drag) return;
    cropState.ox = drag.ox + (e.clientX - drag.x);
    cropState.oy = drag.oy + (e.clientY - drag.y);
    updateCropImage();
  });
  const endDrag = (e)=>{
    drag = null;
    try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', ()=>{ drag = null; });

  document.querySelectorAll('#ratioRow .ratio-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('#ratioRow .ratio-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      cropState.ratioLabel = chip.dataset.r;
      cropState.ratio = RATIO_MAP[chip.dataset.r];
      const parts = chip.dataset.r.split(':');
      if(parts.length===2){
        document.getElementById('customRatioW').value = parts[0];
        document.getElementById('customRatioH').value = parts[1];
      }
      updateCropBoxSize();
      updateCropImage();
    });
  });

  document.getElementById('applyCustomRatio').addEventListener('click',()=>{
    const w = parseFloat(document.getElementById('customRatioW').value);
    const h = parseFloat(document.getElementById('customRatioH').value);
    if(!w || !h || w<=0 || h<=0){ showToast('请输入有效的宽高比'); return; }
    const ratio = w / h;
    document.querySelectorAll('#ratioRow .ratio-chip').forEach(c=>c.classList.remove('active'));
    cropState.ratio = ratio;
    cropState.ratioLabel = `${w}:${h}`;
    updateCropBoxSize();
    updateCropImage();
    showToast(`比例已设为 ${w}:${h}`);
  });

  document.getElementById('rotSlider').addEventListener('input', e=>{
    cropState.rotation = parseInt(e.target.value);
    document.getElementById('rotVal').textContent = cropState.rotation + '°';
    updateCropImage();
  });
  document.querySelectorAll('[data-rot]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const d = parseInt(btn.dataset.rot);
      if(d===0) cropState.rotation = 0;
      else cropState.rotation = ((cropState.rotation + d + 180) % 360) - 180;
      document.getElementById('rotSlider').value = cropState.rotation;
      document.getElementById('rotVal').textContent = cropState.rotation + '°';
      updateCropImage();
    });
  });

  document.getElementById('zoomSlider').addEventListener('input', e=>{
    cropState.zoom = parseFloat(e.target.value);
    document.getElementById('zoomVal').textContent = Math.round(cropState.zoom*100) + '%';
    updateCropImage();
  });

  const cancelAll = ()=>{
    editorOverlay.classList.remove('show');
    cropState = null;
    cachedCropCanvas = null;
  };
  document.getElementById('cropCancel').onclick = cancelAll;
  document.getElementById('cropBack').onclick = cancelAll;

  document.getElementById('cropConfirm').onclick = ()=>{
    cachedCropCanvas = buildCroppedCanvas();
    openSizePage();
  };
}

function buildCroppedCanvas(){
  const c = cropState;
  const img = c.img;
  const k = 4;
  const outW = Math.round(c.boxW * k);
  const outH = Math.round(c.boxH * k);

  const canvas = document.createElement('canvas');
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, outW, outH);

  ctx.save();
  ctx.translate(outW/2 + c.ox * k, outH/2 + c.oy * k);
  ctx.rotate(c.rotation * Math.PI / 180);
  ctx.scale(c.zoom, c.zoom);
  ctx.drawImage(img, -c.dw * k / 2, -c.dh * k / 2, c.dw * k, c.dh * k);
  ctx.restore();
  return canvas;
}

/* ---------- 拼豆图纸生成（按模式区分处理） ---------- */

/* Q版萌化：在采样阶段提亮 + 加饱和 */
const Q_PATTERN_FILTER = 'saturate(1.55) brightness(1.13) contrast(1.02)';

/* Q版萌化：轻微粉调，让画面更软萌 */
function applyQPatternTint(data){
  for(let i=0;i<data.length;i+=4){
    data[i]     = Math.min(255, data[i]     * 1.03 + 10);
    data[i + 1] = Math.min(255, data[i + 1] * 0.99 + 3);
    data[i + 2] = Math.min(255, data[i + 2] * 1.01 + 7);
  }
}

/* 去背景：取四边像素中位色作为背景色 */
function sampleEdgeBg(data, cols, rows){
  const px = [];
  const push = (x, y)=>{
    const i = (y * cols + x) * 4;
    px.push([data[i], data[i+1], data[i+2]]);
  };
  for(let x=0;x<cols;x++){ push(x, 0); push(x, rows-1); }
  for(let y=0;y<rows;y++){ push(0, y); push(cols-1, y); }
  const med = (k)=>{
    const arr = px.map(p=>p[k]).sort((a,b)=>a-b);
    return arr[arr.length >> 1];
  };
  return { r: med(0), g: med(1), b: med(2) };
}

/**
 * 生成拼豆图纸配色
 * @param {number} cols 列数
 * @param {number} rows 行数
 * @param {'pattern'|'q'|'removebg'} mode
 *        pattern  → 普通图片转图纸
 *        q        → Q版萌化拼豆图纸
 *        removebg → 已去除背景的拼豆图纸
 */
function generatePatternFromCrop(cols, rows, mode){
  mode = mode || 'pattern';

  const sample = document.createElement('canvas');
  sample.width = cols; sample.height = rows;
  const sctx = sample.getContext('2d');
  sctx.imageSmoothingEnabled = true;
  sctx.imageSmoothingQuality = 'high';

  /* Q版：采样时先做萌化滤镜 */
  if(mode === 'q') sctx.filter = Q_PATTERN_FILTER;
  sctx.drawImage(cachedCropCanvas, 0, 0, cols, rows);
  sctx.filter = 'none';

  const imgData = sctx.getImageData(0, 0, cols, rows);
  const data = imgData.data;

  /* Q版：叠加粉调 */
  if(mode === 'q') applyQPatternTint(data);

  /* 去背景：边缘采样出背景色，相近格子直接擦为白色（透明） */
  const bg = mode === 'removebg' ? sampleEdgeBg(data, cols, rows) : null;
  const BG_TOL = 82;

  const colors = [];
  for(let i=0;i<cols*rows;i++){
    let r = data[i*4], g = data[i*4+1], b = data[i*4+2];

    if(bg){
      const dr = r - bg.r, dg = g - bg.g, db = b - bg.b;
      if(Math.sqrt(dr*dr + dg*dg + db*db) < BG_TOL){
        colors.push('#ffffff');
        continue;
      }
    }

    if(r>242 && g>242 && b>242){
      colors.push('#ffffff');
    } else {
      r = Math.min(255, Math.round(r / 24) * 24);
      g = Math.min(255, Math.round(g / 24) * 24);
      b = Math.min(255, Math.round(b / 24) * 24);
      colors.push(rgbToHex(r, g, b));
    }
  }
  return colors;
}
